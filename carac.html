<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Copier des caractères spéciaux</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f6f7fb;
      color: #1f2937;
    }

    .card {
      max-width: 720px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    h2 {
      margin-top: 30px;
      font-size: 1.0rem;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .buttons2 {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      font-size: 1.25rem;
      padding: 14px 18px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      transition: 0.15s ease;
      min-width: 72px;
    }

    button:hover {
      background: #eef2ff;
      border-color: #818cf8;
    }

    .message {
      margin-top: 18px;
      min-height: 1.5em;
      font-size: 0.95rem;
      color: #2563eb;
    }

    .hint {
      margin-top: 8px;
      color: #6b7280;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Caractères spéciaux à copier</h1>

    <div><h2>Les principaux</h2></div>
    <div class="buttons">
      <div><button data-char="·">Point médian</button>
      <button data-char="…">…</button>
      <button data-char="–">–</button>
      <button data-char="«»">«»</button>
      <button data-char="“”">“”</button></div>
    </div>
    <div><h2>Et aussi</h2></div>
    <div class="buttons">
      <div><button data-char="«">«</button>
      <button data-char="»">»</button>
      <button data-char="“">“</button>
      <button data-char="”">”</button>
      <button data-char="œ">œ</button>
      <button data-char="👉">👉</button></div>
    </div>
    
  <script>
    const message = document.getElementById("message");

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        message.textContent = `Copié : ${text}`;
      } catch (err) {
        message.textContent = "Impossible de copier automatiquement.";
      }
    }

    document.querySelectorAll("button[data-char]").forEach((btn) => {
      btn.addEventListener("click", () => {
        copyText(btn.dataset.char);
      });
    });
  </script>
</body>
</html>
